aid: quaise-energy
name: Quaise Energy
description: 'Quaise Energy is a deep-geothermal energy company and MIT spinout, founded in 2018 by Carlos
  Araque and Matthew Houde out of a decade of millimeter-wave research by Paul Woskov at the MIT Plasma
  Science and Fusion Center. Quaise is developing millimeter-wave (MMW) drilling — using a gyrotron to
  vaporize rather than grind rock — to reach supercritical conditions several kilometers down, where temperatures
  approach 500 degrees C, and to convert existing fossil-fuel power stations to superhot geothermal baseload.
  The company drilled 100 meters with the technique at its Central Texas field site in 2025. Quaise is
  an energy and hardware company: it publishes no developer program, no public API, and no machine-readable
  API contract. Its only public web application is a levelized-cost-of-energy (LCOE) calculator whose
  full functionality sits behind an AWS Cognito login.'
